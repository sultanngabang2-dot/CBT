  <!-- LAYAR LOGIN AWAL -->
  <div id="login-screen" class="min-h-screen bg-slate-100 flex items-center justify-center p-4 relative z-50">
    <div class="bg-white rounded-2xl shadow-xl overflow-hidden max-w-sm w-full relative z-10 border-t-4 border-emerald-600">
      
      <!-- Header Login -->
      <div class="bg-emerald-700 p-5 text-center relative overflow-hidden">
        <div class="absolute inset-0 bg-black opacity-10"></div>
        <div class="relative z-10 flex flex-col items-center justify-center gap-2">
          <div class="w-12 h-12 bg-white rounded-full flex items-center justify-center shadow-inner">
            <i class="fa-solid fa-graduation-cap text-2xl text-emerald-700"></i>
          </div>
          <h2 class="text-white text-lg font-bold uppercase tracking-wide">CBT MTsN LANDAK</h2>
          <p class="text-emerald-100 text-[10px]">Anti-Curang & Anti-AI System</p>
        </div>
      </div>

      <!-- Tab Login Mode -->
      <div class="flex border-b border-slate-200">
        <button id="tab-btn-siswa" onclick="switchLoginRole('siswa')" class="flex-1 py-3 text-xs font-bold bg-white text-emerald-700 border-b-2 border-emerald-600 transition">
          <i class="fa-solid fa-user-graduate mr-1"></i> LOGIN SISWA
        </button>
        <button id="tab-btn-operator" onclick="switchLoginRole('operator')" class="flex-1 py-3 text-xs font-bold bg-slate-50 text-slate-500 border-b-2 border-transparent hover:text-emerald-600 transition">
          <i class="fa-solid fa-user-shield mr-1"></i> OPERATOR
        </button>
      </div>

      <!-- Form Login Siswa -->
      <form id="form-login-siswa" onsubmit="handleLoginSiswa(event)" class="p-6 space-y-4">
        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1">NISN Peserta (Username)</label>
          <div class="relative">
            <i class="fa-solid fa-id-badge absolute left-3.5 top-3 text-slate-400 text-xs"></i>
            <input type="text" id="login-siswa-nisn" required placeholder="Contoh: 0091234501" class="w-full pl-9 pr-3 py-2 text-xs rounded-xl border border-slate-300 focus:outline-none focus:ring-2 focus:ring-emerald-500">
          </div>
        </div>
        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1">Password Kartu Ujian</label>
          <div class="relative">
            <i class="fa-solid fa-key absolute left-3.5 top-3 text-slate-400 text-xs"></i>
            <input type="password" id="login-siswa-pass" required placeholder="Masukkan 6 digit password..." class="w-full pl-9 pr-10 py-2 text-xs rounded-xl border border-slate-300 focus:outline-none focus:ring-2 focus:ring-emerald-500">
            <button type="button" onclick="togglePasswordVisibility('login-siswa-pass', this)" class="absolute right-3 top-2.5 text-slate-400 hover:text-emerald-600 focus:outline-none">
              <i class="fa-solid fa-eye"></i>
            </button>
          </div>
          <p class="text-[10px] text-slate-500 mt-1">*Lihat username dan password pada Kartu Peserta Ujian Anda.</p>
        </div>
        <button type="submit" class="w-full py-2.5 rounded-xl bg-emerald-700 hover:bg-emerald-800 text-white font-bold text-xs uppercase tracking-wider transition shadow-md flex items-center justify-center gap-2">
          <i class="fa-solid fa-arrow-right-to-bracket"></i> Masuk Ujian Siswa
        </button>
      </form>

      <!-- Form Login Operator -->
      <form id="form-login-operator" onsubmit="handleLoginOperator(event)" class="p-6 space-y-4 hidden">
        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1">Username Operator</label>
          <div class="relative">
            <i class="fa-solid fa-user absolute left-3.5 top-3 text-slate-400 text-xs"></i>
            <input type="text" id="login-op-user" required placeholder="Masukkan username..." class="w-full pl-9 pr-3 py-2 text-xs rounded-xl border border-slate-300 focus:outline-none focus:ring-2 focus:ring-emerald-500">
          </div>
        </div>
        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1">Password Operator</label>
          <div class="relative">
            <i class="fa-solid fa-lock absolute left-3.5 top-3 text-slate-400 text-xs"></i>
            <input type="password" id="login-op-pass" required placeholder="Masukkan password..." class="w-full pl-9 pr-10 py-2 text-xs rounded-xl border border-slate-300 focus:outline-none focus:ring-2 focus:ring-emerald-500">
            <button type="button" onclick="togglePasswordVisibility('login-op-pass', this)" class="absolute right-3 top-2.5 text-slate-400 hover:text-emerald-600 focus:outline-none">
              <i class="fa-solid fa-eye"></i>
            </button>
          </div>
        </div>
        <button type="submit" class="w-full py-2.5 rounded-xl bg-slate-900 hover:bg-black text-white font-bold text-xs uppercase tracking-wider transition shadow-md flex items-center justify-center gap-2">
          <i class="fa-solid fa-shield-halved"></i> Masuk Panel Operator
        </button>
      </form>
    </div>
  </div>
